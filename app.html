<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPARR — Combat Sports Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --neon: #A8FF00;
  --lime: #7CFF00;
  --energy: #39D000;
  --black: #0D0D0D;
  --dark: #1A1A1A;
  --mid: #111111;
  --white: #FFFFFF;
}
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; }
body {
  background: var(--black);
  color: var(--white);
  font-family: 'Raleway', sans-serif;
  min-height: 100%;
  overflow-x: hidden;
}
body::-webkit-scrollbar { width: 6px; }
body::-webkit-scrollbar-track { background: var(--dark); }
body::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

.grid-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  pointer-events: none; z-index: 0;
  background-image:
    linear-gradient(rgba(168,255,0,0.022) 1px, transparent 1px),
    linear-gradient(90deg, rgba(168,255,0,0.022) 1px, transparent 1px);
  background-size: 60px 60px;
}

.app-wrap {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
}

/* HEADER */
.app-header {
  background: rgba(13,13,13,0.95);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(168,255,0,0.12);
  padding: 10px 16px 0;
  position: sticky; top: 0; z-index: 100;
}
.header-top {
  display: flex; align-items: center; justify-content: space-between;
  padding-bottom: 10px;
}
.logo {
  display: flex; align-items: center; gap: 8px;
  font-family: 'Barlow Condensed', sans-serif;
  font-style: italic; font-weight: 900;
  font-size: 1.5rem; text-decoration: none;
}
.logo .sp { color: var(--white); }
.logo .arr { color: var(--neon); }
.logo-icon { font-size: 1.2rem; }
.back-link {
  font-size: 0.7rem; color: rgba(255,255,255,0.4);
  text-decoration: none; font-family: 'Raleway', sans-serif;
  letter-spacing: 0.05em;
  display: block; margin-top: 1px;
}
.back-link:hover { color: var(--neon); }
.logo-block { display: flex; flex-direction: column; }
.header-right {
  display: flex; align-items: center; gap: 12px;
}
.notif-btn {
  background: none; border: none; cursor: pointer;
  font-size: 1.2rem; position: relative; color: var(--white);
  padding: 4px;
}
.notif-dot {
  position: absolute; top: 2px; right: 2px;
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--neon);
}
.avatar-circle {
  width: 34px; height: 34px; border-radius: 50%;
  background: linear-gradient(135deg, var(--neon), var(--energy));
  display: flex; align-items: center; justify-content: center;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 900; font-size: 0.85rem; color: var(--black);
  cursor: pointer;
}
.role-tabs {
  display: flex; gap: 0;
}
.role-tab {
  flex: 1; background: none; border: none; cursor: pointer;
  font-family: 'Barlow Condensed', sans-serif;
  font-style: italic; font-weight: 900;
  font-size: 0.85rem; letter-spacing: 0.08em;
  color: rgba(255,255,255,0.4);
  padding: 8px 4px; text-align: center;
  border-bottom: 2px solid transparent;
  transition: all 0.2s; text-transform: uppercase;
}
.role-tab.active {
  color: var(--neon);
  border-bottom-color: var(--neon);
}
.role-tab:hover:not(.active) { color: rgba(255,255,255,0.7); }

/* BOTTOM NAV */
.bottom-nav {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px;
  background: rgba(13,13,13,0.97);
  backdrop-filter: blur(20px);
  border-top: 1px solid rgba(168,255,0,0.1);
  display: flex; z-index: 100;
  padding-bottom: env(safe-area-inset-bottom, 0);
}
.nav-item {
  flex: 1; background: none; border: none; cursor: pointer;
  padding: 10px 4px 8px;
  display: flex; flex-direction: column;
  align-items: center; gap: 3px;
  color: rgba(255,255,255,0.4);
  transition: color 0.2s;
  font-family: 'Raleway', sans-serif;
  font-size: 0.6rem; font-weight: 600;
  letter-spacing: 0.06em; text-transform: uppercase;
}
.nav-item.active { color: var(--neon); }
.nav-item:hover:not(.active) { color: rgba(255,255,255,0.7); }
.nav-icon { font-size: 1.1rem; line-height: 1; }
.nav-item.center-fab {
  flex: 1;
}
.nav-item.center-fab .nav-icon {
  width: 44px; height: 44px; border-radius: 50%;
  background: linear-gradient(135deg, var(--neon), var(--energy));
  display: flex; align-items: center; justify-content: center;
  font-size: 1.4rem; color: var(--black);
  margin-top: -14px;
  box-shadow: 0 0 20px rgba(168,255,0,0.4);
}
.nav-item.center-fab.active .nav-icon,
.nav-item.center-fab:hover .nav-icon {
  box-shadow: 0 0 30px rgba(168,255,0,0.6);
}

/* MAIN CONTENT */
.main-content {
  flex: 1;
  padding: 16px 16px 80px;
  overflow-y: auto;
}

/* GLASS CARDS */
.glass-card {
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(168,255,0,0.18);
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 12px;
}
.glass-card-sm {
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(168,255,0,0.12);
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 8px;
}
.card-neon-bar {
  height: 3px;
  background: linear-gradient(90deg, var(--neon), var(--energy));
  border-radius: 2px 2px 0 0;
  margin: -16px -16px 14px;
  border-radius: 16px 16px 0 0;
}

/* BUTTONS */
.btn-primary {
  background: linear-gradient(135deg, #A8FF00, #39D000);
  color: var(--black);
  border: none; cursor: pointer;
  font-family: 'Barlow Condensed', sans-serif;
  font-style: italic; font-weight: 900;
  font-size: 0.9rem; letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 10px 20px; border-radius: 6px;
  transition: all 0.2s;
  display: inline-flex; align-items: center; gap: 6px;
}
.btn-primary:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 20px rgba(168,255,0,0.35);
}
.btn-primary:active { transform: translateY(0); }
.btn-ghost {
  background: transparent;
  color: var(--white);
  border: 1px solid rgba(168,255,0,0.5);
  cursor: pointer;
  font-family: 'Barlow Condensed', sans-serif;
  font-style: italic; font-weight: 900;
  font-size: 0.85rem; letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 8px 16px; border-radius: 6px;
  transition: all 0.2s;
  display: inline-flex; align-items: center; gap: 6px;
}
.btn-ghost:hover {
  border-color: var(--neon);
  color: var(--neon);
  background: rgba(168,255,0,0.05);
}
.btn-sm {
  padding: 6px 12px; font-size: 0.75rem;
}
.btn-full { width: 100%; justify-content: center; }

/* BADGES */
.badge {
  display: inline-block;
  padding: 2px 8px; border-radius: 20px;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700; font-size: 0.65rem;
  letter-spacing: 0.1em; text-transform: uppercase;
}
.badge-neon { background: rgba(168,255,0,0.15); color: var(--neon); border: 1px solid rgba(168,255,0,0.3); }
.badge-green { background: rgba(57,208,0,0.15); color: var(--energy); border: 1px solid rgba(57,208,0,0.3); }
.badge-orange { background: rgba(255,140,0,0.15); color: #FF8C00; border: 1px solid rgba(255,140,0,0.3); }
.badge-red { background: rgba(255,60,60,0.15); color: #FF3C3C; border: 1px solid rgba(255,60,60,0.3); }
.badge-blue { background: rgba(60,140,255,0.15); color: #3C8CFF; border: 1px solid rgba(60,140,255,0.3); }
.badge-purple { background: rgba(160,60,255,0.15); color: #A03CFF; border: 1px solid rgba(160,60,255,0.3); }
.badge-gray { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.6); border: 1px solid rgba(255,255,255,0.15); }

/* STATS BAR */
.stats-bar {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 8px; margin-bottom: 20px;
}
.stat-item {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(168,255,0,0.1);
  border-radius: 10px;
  padding: 10px 8px; text-align: center;
}
.stat-value {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 900; font-size: 1.5rem;
  color: var(--neon); line-height: 1;
}
.stat-label {
  font-size: 0.6rem; color: rgba(255,255,255,0.5);
  font-weight: 600; letter-spacing: 0.05em;
  text-transform: uppercase; margin-top: 3px;
}

/* SECTION HEADERS */
.section-header {
  display: flex; align-items: center;
  justify-content: space-between;
  margin-bottom: 12px; margin-top: 20px;
}
.section-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-style: italic; font-weight: 900;
  font-size: 1.1rem; letter-spacing: 0.05em;
  text-transform: uppercase; color: var(--white);
}
.section-title:first-child { margin-top: 0; }

/* FORMS */
.form-group { margin-bottom: 14px; }
.form-label {
  display: block; font-size: 0.75rem; font-weight: 600;
  color: rgba(255,255,255,0.6); margin-bottom: 6px;
  text-transform: uppercase; letter-spacing: 0.06em;
}
.form-input, .form-select, .form-textarea {
  width: 100%;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(168,255,0,0.2);
  border-radius: 8px;
  color: var(--white);
  font-family: 'Raleway', sans-serif;
  font-size: 0.9rem;
  padding: 10px 12px;
  outline: none;
  transition: border-color 0.2s;
}
.form-input:focus, .form-select:focus, .form-textarea:focus {
  border-color: var(--neon);
  background: rgba(168,255,0,0.04);
}
.form-select { cursor: pointer; }
.form-select option { background: var(--dark); }
.form-textarea { resize: vertical; min-height: 80px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* RANGE SLIDER */
.range-wrap { position: relative; }
input[type=range] {
  width: 100%; -webkit-appearance: none;
  height: 4px; border-radius: 2px;
  background: rgba(255,255,255,0.1);
  outline: none; cursor: pointer;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 20px; height: 20px; border-radius: 50%;
  background: linear-gradient(135deg, var(--neon), var(--energy));
  cursor: pointer; box-shadow: 0 0 10px rgba(168,255,0,0.4);
}
.range-value {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 900; font-size: 1.8rem;
  color: var(--neon); text-align: center;
  line-height: 1;
}

/* CHECKBOXES */
.checkbox-wrap {
  display: flex; align-items: center; gap: 10px;
  cursor: pointer; padding: 6px 0;
}
.checkbox-wrap input[type=checkbox] {
  width: 18px; height: 18px; cursor: pointer;
  accent-color: var(--neon);
}
.checkbox-label { font-size: 0.9rem; color: rgba(255,255,255,0.8); }

/* TOAST */
.toast-container {
  position: fixed; top: 80px; left: 50%;
  transform: translateX(-50%);
  z-index: 9999; width: 90%; max-width: 400px;
}
.toast {
  background: rgba(26,26,26,0.97);
  border: 1px solid rgba(168,255,0,0.4);
  border-radius: 10px;
  padding: 12px 16px;
  margin-bottom: 8px;
  font-size: 0.85rem;
  display: flex; align-items: center; gap: 10px;
  animation: toastIn 0.3s ease;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5), 0 0 20px rgba(168,255,0,0.1);
}
.toast.removing { animation: toastOut 0.3s ease forwards; }
.toast-icon { font-size: 1.1rem; }
.toast-text { flex: 1; font-weight: 600; }
@keyframes toastIn { from { opacity: 0; transform: translateY(-10px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes toastOut { from { opacity: 1; } to { opacity: 0; transform: translateY(-10px); } }

/* MODAL */
.modal-overlay {
  position: fixed; inset: 0; z-index: 500;
  background: rgba(0,0,0,0.8);
  backdrop-filter: blur(4px);
  display: flex; align-items: flex-end; justify-content: center;
  padding: 0;
}
.modal-overlay.center { align-items: center; padding: 20px; }
.modal-sheet {
  background: var(--dark);
  border: 1px solid rgba(168,255,0,0.2);
  border-radius: 20px 20px 0 0;
  width: 100%; max-width: 480px;
  max-height: 90vh; overflow-y: auto;
  padding: 20px;
  animation: slideUp 0.3s ease;
}
.modal-overlay.center .modal-sheet {
  border-radius: 20px; max-height: 80vh;
}
@keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal-handle {
  width: 40px; height: 4px; border-radius: 2px;
  background: rgba(255,255,255,0.2);
  margin: 0 auto 16px;
}
.modal-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-style: italic; font-weight: 900;
  font-size: 1.3rem; text-transform: uppercase;
  color: var(--neon); margin-bottom: 16px;
}

/* DISCIPLINE GRID */
.disc-grid {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 8px; margin-bottom: 4px;
}
.disc-btn {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(168,255,0,0.15);
  border-radius: 8px; padding: 10px 6px;
  text-align: center; cursor: pointer;
  font-family: 'Raleway', sans-serif;
  font-size: 0.7rem; font-weight: 600;
  color: rgba(255,255,255,0.6);
  transition: all 0.15s;
  display: flex; flex-direction: column;
  align-items: center; gap: 4px;
}
.disc-btn .disc-icon { font-size: 1.3rem; }
.disc-btn.selected {
  background: rgba(168,255,0,0.12);
  border-color: var(--neon);
  color: var(--neon);
}
.disc-btn:hover:not(.selected) {
  border-color: rgba(168,255,0,0.35);
  color: rgba(255,255,255,0.85);
}

/* MOOD SELECTOR */
.mood-grid {
  display: grid; grid-template-columns: repeat(5, 1fr);
  gap: 6px;
}
.mood-btn {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px; padding: 8px 4px;
  cursor: pointer; text-align: center;
  font-size: 0.6rem; color: rgba(255,255,255,0.5);
  transition: all 0.15s;
  display: flex; flex-direction: column;
  align-items: center; gap: 4px;
}
.mood-btn .mood-emoji { font-size: 1.4rem; }
.mood-btn.selected {
  background: rgba(168,255,0,0.1);
  border-color: var(--neon); color: var(--neon);
}

/* STREAK CARD */
.streak-card {
  background: linear-gradient(135deg, rgba(168,255,0,0.1), rgba(57,208,0,0.05));
  border: 1px solid rgba(168,255,0,0.35);
  border-radius: 16px; padding: 16px;
  margin-bottom: 12px;
  display: flex; align-items: center; justify-content: space-between;
}
.streak-value {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 900; font-style: italic;
  font-size: 2.8rem; color: var(--neon); line-height: 1;
}
.streak-label { font-size: 0.7rem; color: rgba(255,255,255,0.5); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }

/* PROGRESS BAR */
.progress-bar-wrap {
  background: rgba(255,255,255,0.08);
  border-radius: 4px; height: 6px;
  overflow: hidden; margin: 8px 0;
}
.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--neon), var(--energy));
  border-radius: 4px;
  transition: width 0.5s ease;
}

/* SCHEDULE GRID */
.schedule-grid {
  display: grid; grid-template-columns: 50px 1fr 1fr 1fr;
  gap: 2px;
}
.schedule-time-label {
  font-size: 0.65rem; color: rgba(255,255,255,0.35);
  text-align: right; padding: 6px 6px 0 0;
  font-weight: 600;
}
.schedule-mat-header {
  background: rgba(168,255,0,0.08);
  border: 1px solid rgba(168,255,0,0.2);
  border-radius: 6px; padding: 6px;
  text-align: center;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 900; font-style: italic;
  font-size: 0.8rem; color: var(--neon);
}
.schedule-slot {
  border-radius: 6px; padding: 6px;
  min-height: 52px; cursor: pointer;
  transition: all 0.15s;
  font-size: 0.7rem;
  border: 1px solid transparent;
}
.schedule-slot.empty {
  background: rgba(255,255,255,0.02);
  border-color: rgba(255,255,255,0.05);
}
.schedule-slot.empty:hover {
  background: rgba(168,255,0,0.04);
  border-color: rgba(168,255,0,0.15);
}
.schedule-slot.fight {
  background: rgba(168,255,0,0.08);
  border-color: rgba(168,255,0,0.25);
}
.schedule-slot.warmup {
  background: rgba(255,140,0,0.07);
  border-color: rgba(255,140,0,0.2);
}
.schedule-slot.break {
  background: rgba(255,255,255,0.03);
  border-color: rgba(255,255,255,0.08);
}
.slot-label {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700; font-size: 0.75rem;
  color: var(--neon); margin-bottom: 2px;
}
.slot-detail { color: rgba(255,255,255,0.5); font-size: 0.65rem; }

/* BROADCAST LAYOUT */
.broadcast-layout { display: flex; flex-direction: column; gap: 12px; }
.broadcast-recipients {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(168,255,0,0.12);
  border-radius: 12px; padding: 14px;
}
.broadcast-composer {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(168,255,0,0.12);
  border-radius: 12px; padding: 14px;
}
.msg-type-tabs {
  display: flex; gap: 6px; margin-bottom: 12px;
  flex-wrap: wrap;
}
.msg-type-tab {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px; padding: 5px 12px;
  font-size: 0.72rem; font-weight: 600;
  cursor: pointer; color: rgba(255,255,255,0.5);
  transition: all 0.15s;
}
.msg-type-tab.active {
  background: rgba(168,255,0,0.12);
  border-color: var(--neon); color: var(--neon);
}
.template-btns { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.template-btn {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 8px; padding: 8px 10px;
  text-align: left; cursor: pointer;
  font-size: 0.75rem; color: rgba(255,255,255,0.55);
  transition: all 0.15s;
  font-family: 'Raleway', sans-serif;
}
.template-btn:hover {
  border-color: rgba(168,255,0,0.3);
  color: rgba(255,255,255,0.85);
  background: rgba(168,255,0,0.05);
}
.msg-log { margin-top: 12px; }
.msg-log-item {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 8px; padding: 10px;
  margin-bottom: 6px;
}
.msg-log-meta {
  display: flex; justify-content: space-between;
  margin-bottom: 4px;
}
.msg-log-to { font-size: 0.65rem; color: var(--neon); font-weight: 700; text-transform: uppercase; }
.msg-log-time { font-size: 0.65rem; color: rgba(255,255,255,0.35); }
.msg-log-text { font-size: 0.78rem; color: rgba(255,255,255,0.7); }

/* ATHLETE CARD */
.athlete-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.athlete-card {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(168,255,0,0.12);
  border-radius: 12px; padding: 14px;
}
.athlete-avatar {
  width: 42px; height: 42px; border-radius: 50%;
  background: linear-gradient(135deg, rgba(168,255,0,0.3), rgba(57,208,0,0.2));
  border: 2px solid rgba(168,255,0,0.3);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 900; font-size: 1rem; color: var(--neon);
  margin-bottom: 8px;
}
.athlete-name {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700; font-size: 0.95rem;
  margin-bottom: 4px;
}
.athlete-meta { font-size: 0.68rem; color: rgba(255,255,255,0.45); margin-top: 2px; }

/* EVENT CARD */
.event-card {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(168,255,0,0.18);
  border-radius: 16px;
  padding: 16px; margin-bottom: 10px;
  overflow: hidden; position: relative;
}

<script>
// ===================== STATE =====================
let currentRole = 'athlete';
let currentView = 'home';
let currentParams = {};
let activeFilter = 'all';

let broadcastMsgLog = [];
let selectedDiscipline = '';
let selectedMood = '';
let intensityVal = 7;
let beRealOpen = false;
let likedPosts = new Set();

// ===================== DATA =====================
const STORAGE_KEYS = {
  sessions: 'sparr_sessions',
  events: 'sparr_events',
  announcements: 'sparr_announcements',
  challenges: 'sparr_challenges',
  posts: 'sparr_posts'
};

function today(offset = 0) {
  const d = new Date();
  d.setDate(d.getDate() - offset);
  return d.toISOString().split('T')[0];
}

function seedData() {

    localStorage.setItem(STORAGE_KEYS.sessions, JSON.stringify([
      { id:1, discipline:'Boxing', duration:45, rounds:8, intensity:7, type:'Training', notes:'Clean rounds. Better footwork.', date: today(1), weight:76.8 },

      { id:1, name:'Zurich Open 2026', type:'Tournament', date:'2026-01-15', location:'Zurich', athletes:47, status:'upcoming', disciplines:['Boxing','Kickboxing','MMA'], maxParticipants:64, description:'Annual open tournament for all combat sports.' },
      { id:2, name:'City Sparring Day', type:'Sparring', date:'2025-12-28', location:'Zurich', athletes:24, status:'upcoming', disciplines:['Boxing','Muay Thai'], maxParticipants:30, description:'Open sparring day for registered athletes.' },
      { id:3, name:'BJJ Seminar Zürich', type:'Seminar', date:'2026-01-10', location:'Zurich', athletes:18, status:'upcoming', disciplines:['BJJ'], maxParticipants:24, description:'BJJ fundamentals seminar with guest instructor.' }

  if (!localStorage.getItem(STORAGE_KEYS.announcements)) {
    localStorage.setItem(STORAGE_KEYS.announcements, JSON.stringify([

      { id:1, name:'5K Fighter Run', goal:5, progress:2, unit:'runs', daysLeft:3, active:true, icon:'🏃' },
      { id:2, name:'100 Round Bag Challenge', goal:100, progress:34, unit:'rounds', daysLeft:12, active:true, icon:'🥊' },
      { id:3, name:'30-Day Combat Base', goal:30, progress:12, unit:'days', daysLeft:18, active:true, icon:'🔥' },
      { id:4, name:'Fight Camp Consistency Week', goal:7, progress:0, unit:'days', daysLeft:7, active:false, icon:'🏆' },
      { id:5, name:'Mobility for Fighters 14-Day', goal:14, progress:0, unit:'days', daysLeft:14, active:false, icon:'🧘' }
    ]));
  }
  if (!localStorage.getItem(STORAGE_KEYS.posts)) {
    localStorage.setItem(STORAGE_KEYS.posts, JSON.stringify([
      { id:1, author:'Kampfclub Zürich', initials:'KZ', type:'Training Highlight', text:'Incredible session this morning — all competition athletes dialed in and ready for the Zurich Open. The grind doesn\'t stop. 💪', timestamp: today(1), likes:14 },
      { id:2, author:'Coach Meijer', initials:'CM', type:'Motivation', text:'"Champions aren\'t made in gyms. Champions are made from something deep inside them." — The work you put in now defines who you are on fight day.', timestamp: today(2), likes:22 }
    ]));
  }
  broadcastMsgLog = [
    { to:'All Athletes (47)', type:'Announcement', text:'Registration deadline for Zurich Open is December 20th. All athletes confirm weight class.', time:'14:32' },
    { to:'Mat 1 Athletes (9)', type:'Timing', text:'Your fight starts in 15 minutes on Mat 1', time:'11:15' },
    { to:'Coaches & Cornermen (12)', type:'Urgent', text:'Staff briefing in 10 minutes at the main desk. All coaches required.', time:'09:45' }

function getData(key) { try { return JSON.parse(localStorage.getItem(STORAGE_KEYS[key])) || []; } catch(e) { return []; } }
function saveData(key, data) { localStorage.setItem(STORAGE_KEYS[key], JSON.stringify(data)); }

// ===================== NAVIGATION =====================
const NAV_CONFIG = {
  organize: [
    { id:'home', icon:'🏠', label:'Home' },
    { id:'events', icon:'📅', label:'Events' },
    { id:'broadcast', icon:'📡', label:'Broadcast' },
    { id:'schedule', icon:'🗓', label:'Schedule' },
    { id:'me', icon:'👤', label:'Me' }
  ],
  coach: [
    { id:'gym', icon:'🏋', label:'Gym' },
    { id:'athletes', icon:'👥', label:'Athletes' },
    { id:'announce', icon:'📣', label:'Announce' },
    { id:'events', icon:'📅', label:'Events' },
    { id:'feed', icon:'📰', label:'Feed' }
  ],
  athlete: [
    { id:'home', icon:'🏠', label:'Home' },
    { id:'log', icon:'📝', label:'Log' },
    { id:'logcenter', icon:'+', label:'Log', center:true },
    { id:'challenges', icon:'🏆', label:'Challenges' },
    { id:'me', icon:'👤', label:'Me' }
  ]
};

function switchRole(role) {
  currentRole = role;
  const defaultViews = { organize:'home', coach:'gym', athlete:'home' };
  currentView = defaultViews[role];
  currentParams = {};
  document.querySelectorAll('.role-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.role === role);
  });
  const avatarInits = { organize:'ZO', coach:'CM', athlete:'AK' };
  document.getElementById('avatarCircle').textContent = avatarInits[role];
  renderCurrentView();
  renderBottomNav();
}

function navigate(view, params = {}) {
  currentView = view;
  currentParams = params;
  renderCurrentView();
  renderBottomNav();
}

function renderBottomNav() {
  const nav = document.getElementById('bottomNav');
  const items = NAV_CONFIG[currentRole];
  nav.innerHTML = items.map(item => {
    if (item.center) {
      return `<button class="nav-item center-fab ${currentView === 'log' ? 'active' : ''}" onclick="navigate('log')">
        <span class="nav-icon">+</span>
        <span>Log</span>
      </button>`;
    }
    return `<button class="nav-item ${currentView === item.id ? 'active' : ''}" onclick="navigate('${item.id}')">
      <span class="nav-icon">${item.icon}</span>
      <span>${item.label}</span>
    </button>`;
  }).join('');
}

function renderCurrentView() {
  const content = document.getElementById('mainContent');
  content.innerHTML = '';
  content.className = 'main-content fade-in';
  const renderers = {
    organize: { home: renderOrganizeHome, events: renderOrganizeEvents, broadcast: renderBroadcast, schedule: renderSchedule, me: renderOrganizeMe },
    coach: { gym: renderCoachGym, athletes: renderCoachAthletes, announce: renderCoachAnnounce, events: renderCoachEvents, feed: renderCoachFeed },
    athlete: { home: renderAthleteHome, log: renderAthleteLog, challenges: renderAthleteChallenges, me: renderAthleteMe }
  };
  const fn = renderers[currentRole]?.[currentView];
  if (fn) fn(content);
}

// ===================== ORGANIZE VIEWS =====================
function renderOrganizeHome(el) {
  const events = getData('events');
  el.innerHTML = `
    <div class="stats-bar">
      <div class="stat-item"><div class="stat-value">${events.length}</div><div class="stat-label">Events</div></div>
      <div class="stat-item"><div class="stat-value">47</div><div class="stat-label">Athletes</div></div>
      <div class="stat-item"><div class="stat-value">12</div><div class="stat-label">Staff</div></div>
      <div class="stat-item"><div class="stat-value">8</div><div class="stat-label">Today's Fights</div></div>
    </div>
    <div class="section-header">
      <span class="section-title">Upcoming Events</span>
      <button class="btn-ghost btn-sm" onclick="navigate('events')">View All</button>
    </div>
    ${events.slice(0,3).map(ev => renderEventCard(ev)).join('')}
    <div class="cta-block">

function sendBroadcast() {
  const msg = document.getElementById('broadcastMsg')?.value?.trim();
  if (!msg) { showToast('⚠️ Please enter a message', 'warn'); return; }
  const checked = document.querySelectorAll('[id^="rcpt_"]:checked');
  let total = 0;
  checked.forEach(cb => {
    const counts = {all:47,coaches:12,staff:8,fans:156,u75:11,teamSun:4,mat1:9,mat2:8};
    const key = cb.id.replace('rcpt_','');
    total += counts[key] || 0;
  });
  const toLabel = checked.length === 1 ? checked[0].nextElementSibling?.textContent : `${checked.length} groups`;
  const now = new Date();
  const timeStr = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
  broadcastMsgLog.unshift({ to: toLabel || 'Selected Groups', type: activeMsgType, text: msg, time: timeStr });
  if (broadcastMsgLog.length > 5) broadcastMsgLog = broadcastMsgLog.slice(0,5);
  showToast(`📡 Sent to ${total} recipients`, 'success');
  navigate('broadcast');
}

function calcStreak() {
  const sessions = getData('sessions');
  if (!sessions.length) return { current: 0, best: 0 };
  const dates = [...new Set(sessions.map(s => s.date))].sort().reverse();
  let streak = 0, best = 0, cur = new Date(today(0));
  for (let i = 0; i < 30; i++) {
    const d = new Date(cur);
    d.setDate(d.getDate() - i);
    const ds = d.toISOString().split('T')[0];
    if (dates.includes(ds)) { streak++; best = Math.max(best, streak); }
    else if (i === 0) { continue; }
    else { break; }
  }
  return { current: streak, best: Math.max(best, 4) };
}

function selectDiscipline(name) { selectedDiscipline = name; navigate('log'); }
function selectMood(id) { selectedMood = id; navigate('log'); }
function updateIntensity(v) {
  intensityVal = parseInt(v);
  const el = document.getElementById('intensityDisplay');
  if (el) { el.textContent = v; el.style.color = intensityVal >= 8 ? '#FF4444' : intensityVal >= 6 ? '#A8FF00' : '#39D000'; }
}
function toggleBeReal(checked) { beRealOpen = checked; navigate('log'); }

function logSession() {
  if (!selectedDiscipline) { showToast('⚠️ Select a discipline', 'warn'); return; }
  const duration = parseInt(document.getElementById('logDuration')?.value) || 0;
  if (!duration) { showToast('⚠️ Enter session duration', 'warn'); return; }
  const rounds = parseInt(document.getElementById('logRounds')?.value) || 0;
  const type = document.getElementById('logType')?.value || 'Training';
  const weight = parseFloat(document.getElementById('logWeight')?.value) || null;
  const notes = document.getElementById('logNotes')?.value?.trim() || '';
  const honest = document.getElementById('logHonest')?.value?.trim() || '';
  const sessions = getData('sessions');
  sessions.unshift({
    id: Date.now(), discipline: selectedDiscipline,
    duration, rounds, intensity: intensityVal, type,
    notes: honest ? `${notes}${notes?' — ':''}(BeReal: ${honest})` : notes,
    date: today(0), weight
  });
  saveData('sessions', sessions);
  selectedDiscipline = '';
  selectedMood = '';
  intensityVal = 7;
  beRealOpen = false;
  showToast('✅ Session logged!', 'success');
  navigate('home');
}

function openChallengeLog(id) {
  const challenges = getData('challenges');
  const c = challenges.find(c => c.id === id);
  if (!c) return;
  const container = document.getElementById('modalContainer');
  container.innerHTML = `
    <div class="modal-overlay center" onclick="if(event.target===this)closeModal()">
      <div class="modal-sheet">
        <div class="modal-title">${c.icon} ${c.name}</div>

function logChallengeProgress(id) {
  const val = parseInt(document.getElementById('challengeProgress')?.value) || 1;
  const challenges = getData('challenges');
  const c = challenges.find(c => c.id === id);
  if (c) {
    c.progress = Math.min(c.goal, c.progress + val);
    if (c.progress >= c.goal) { showToast(`🏆 Challenge complete: ${c.name}!`, 'success'); }
    else { showToast(`💪 +${val} logged! ${c.goal - c.progress} to go.`, 'success'); }
    saveData('challenges', challenges);
  }
  closeModal();
  navigate('challenges');
}

// ===================== TOAST =====================
function showToast(msg, type = 'info') {
  const icons = { success:'✅', warn:'⚠️', info:'ℹ️', error:'❌' };
  const colors = { success:'rgba(168,255,0,0.3)', warn:'rgba(255,140,0,0.3)', info:'rgba(60,140,255,0.3)', error:'rgba(255,60,60,0.3)' };
  const container = document.getElementById('toastContainer');
  const id = Date.now();
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.id = `toast_${id}`;
  toast.style.borderColor = colors[type];
  toast.innerHTML = `<span class="toast-icon">${icons[type]}</span><span class="toast-text">${msg}</span>`;
  container.appendChild(toast);
  setTimeout(() => {
    const el = document.getElementById(`toast_${id}`);
    if (el) { el.classList.add('removing'); setTimeout(() => el.remove(), 300); }
  }, 3000);
}

// ===================== UTILITIES =====================
function formatDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
}
function formatDateShort(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  const now = new Date();
  const diff = Math.floor((now - d) / 86400000);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Yesterday';
  if (diff < 7) return `${diff} days ago`;
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${d.getDate()} ${months[d.getMonth()]}`;
}
